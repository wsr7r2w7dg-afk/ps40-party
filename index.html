<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#260708"><title>PS40 PARTY • Câmera</title><style>*{box-sizing:border-box}body{margin:0;background:#160607;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center}header{padding:10px;font-weight:700;letter-spacing:.08em;color:#f5d18a}.stage{position:relative;width:min(100vw,calc((100dvh - 185px)*9/16),500px);aspect-ratio:9/16;margin:auto;background:#290b0c;overflow:hidden;border-radius:12px}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage video.mirror{transform:scaleX(-1)}.stage img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px;flex-wrap:wrap}button,a.save{background:#e3b65b;color:#230708;border:0;border-radius:999px;padding:11px 17px;font-weight:700;font-size:14px}button:disabled{opacity:.45}.secondary{background:#4b2020;color:white;border:1px solid #b58a46}.status{font-size:12px;color:#f3d9ae;min-height:20px;padding:0 10px}.save{display:none;text-decoration:none}#preview{display:none;max-width:180px;max-height:250px;margin:12px auto}#preview.show{display:block}footer{font-size:11px;color:#d3bdb5;padding:5px 15px 20px}</style></head><body><header>✨ PS40 PARTY ✨</header><div class="stage"><video id="camera" autoplay muted playsinline></video><img src="moldura.png" alt="Moldura PS40 PARTY"></div><div class="controls"><button id="start">Abrir câmera</button><button id="flip" class="secondary" disabled>Virar câmera</button><button id="photo" disabled>📸 Foto</button><button id="record" disabled>🔴 Gravar vídeo</button><a id="save" class="save">Salvar arquivo</a></div><div id="status" class="status">Autorize câmera e microfone quando solicitado.</div><img id="preview" alt="Prévia da foto"><footer>Use Safari ou Chrome atualizado. A gravação depende do suporte do navegador. Fotos e vídeos ficam no seu aparelho.</footer><script>
const v=document.querySelector('#camera'), overlay=new Image();overlay.src='moldura.png';const status=document.querySelector('#status'),save=document.querySelector('#save'),preview=document.querySelector('#preview');const btn=(id)=>document.getElementById(id);let stream,front=true,recorder,chunks=[],raf,renderCanvas,renderCtx,audioCtx;
function message(t){status.textContent=t}function controls(on){for(const id of ['flip','photo','record'])btn(id).disabled=!on}
async function openCam(){try{if(recorder?.state==='recording')return;stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:1080},height:{ideal:1920}},audio:{echoCancellation:true}});v.srcObject=stream;await v.play();v.classList.toggle('mirror',front);controls(true);message('Câmera pronta! Tire uma foto ou grave um vídeo.')}catch(e){message('Não foi possível abrir a câmera/microfone: '+e.message+'. Confira as permissões e use HTTPS.')}}
function draw(ctx,w,h){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);if(v.videoWidth){let vw=v.videoWidth,vh=v.videoHeight,scale=Math.max(w/vw,h/vh),sw=w/scale,sh=h/scale,sx=(vw-sw)/2,sy=(vh-sh)/2;ctx.save();if(front){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(v,sx,sy,sw,sh,0,0,w,h);ctx.restore()}if(overlay.complete&&overlay.naturalWidth)ctx.drawImage(overlay,0,0,w,h)}
function canvas(){let c=document.createElement('canvas');c.width=720;c.height=1280;return c}
btn('start').onclick=openCam;btn('flip').onclick=()=>{front=!front;openCam()};btn('photo').onclick=()=>{let c=canvas();draw(c.getContext('2d'),c.width,c.height);c.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob);save.href=url;save.download='PS40-PARTY-foto.png';save.style.display='inline-block';save.textContent='⬇️ Salvar foto';preview.src=url;preview.classList.add('show');message('Foto pronta! Toque em Salvar foto.')},'image/png')};
btn('record').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();return}if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder){message('Este navegador não oferece gravação de vídeo com a moldura. Experimente outro navegador ou use a opção Foto.');return}try{renderCanvas=canvas();renderCtx=renderCanvas.getContext('2d');let render=()=>{draw(renderCtx,renderCanvas.width,renderCanvas.height);raf=requestAnimationFrame(render)};render();let output=renderCanvas.captureStream(30);const tracks=stream.getAudioTracks();if(tracks.length){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();let source=audioCtx.createMediaStreamSource(new MediaStream(tracks));let dest=audioCtx.createMediaStreamDestination();source.connect(dest);dest.stream.getAudioTracks().forEach(t=>output.addTrack(t))}catch(e){message('Áudio não disponível neste navegador; vídeo pode sair sem som.')}}let formats=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'];let mime=formats.find(f=>MediaRecorder.isTypeSupported(f));recorder=new MediaRecorder(output,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{cancelAnimationFrame(raf);audioCtx?.close();let type=recorder.mimeType||'video/webm';let blob=new Blob(chunks,{type});save.href=URL.createObjectURL(blob);save.download='PS40-PARTY-video.'+(type.includes('mp4')?'mp4':'webm');save.textContent='⬇️ Salvar vídeo';save.style.display='inline-block';btn('record').textContent='🔴 Gravar vídeo';btn('flip').disabled=false;btn('photo').disabled=false;message('Vídeo pronto! Salve o arquivo. Formato: '+type)};recorder.start(250);btn('record').textContent='⏹️ Parar gravação';btn('flip').disabled=true;btn('photo').disabled=true;save.style.display='none';message('Gravando… toque em Parar gravação para finalizar.')}catch(e){cancelAnimationFrame(raf);message('A gravação não é compatível com este navegador: '+e.message)}};
</script></body></html>
